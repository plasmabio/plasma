{% extends "page.html" %}

{% block main %}
{% if default_server.active %}
<style>
html, body {
  height: 100%;
  margin: 0;
  overflow: hidden;
}
.app-frame {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  border: none;
  z-index: 1;
}
/* ---- side panel ---- */
.side-panel {
  position: fixed;
  right: 0;
  top: 50%;
  transform: translateY(-50%);
  z-index: 10000;
  display: flex;
  flex-direction: row;
  align-items: center;
  background: transparent;
}
.side-toggle {
  width: 34px;
  height: 96px;
  padding: 6px 0;
  border: none;
  border-radius: 8px 0 0 8px;
  background: rgba(255,255,255,0.92);
  box-shadow: -2px 0 10px rgba(0,0,0,0.2);
  cursor: pointer;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: space-between;
  transition: background 0.2s, box-shadow 0.2s;
}
.side-toggle:hover {
  background: rgba(255,255,255,1);
  box-shadow: -2px 0 14px rgba(0,0,0,0.3);
}
.toggle-logo-wrap {
  width: 26px;
  height: 72px;
  overflow: hidden;
  position: relative;
  flex-shrink: 0;
}
.toggle-logo {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%) rotate(-90deg);
  width: 72px;
  height: 26px;
  object-fit: contain;
}
#toggle-icon {
  color: #1a2f5a;
  font-size: 13px;
}
.side-menu {
  overflow: hidden;
  max-width: 0;
  transition: max-width 0.25s ease;
}
.side-menu-inner {
  display: flex;
  flex-direction: column;
  gap: 6px;
  padding: 10px 8px;
  background: rgba(255,255,255,0.95);
  box-shadow: -3px 0 12px rgba(0,0,0,0.15);
  border-radius: 6px 0 0 6px;
  white-space: nowrap;
}
.side-panel.expanded .side-menu {
  max-width: 140px;
}
.side-panel.expanded .side-toggle {
  border-radius: 0;
}
/* ---- loading overlay ---- */
.iframe-overlay {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  z-index: 50;
  display: flex;
  align-items: center;
  justify-content: center;
  background: var(--jp-layout-color1, #fff);
}
.iframe-status {
  text-align: center;
}
</style>

<iframe
  class="app-frame"
  id="user-app-frame"
  src="{{ base_url }}user/{{ user.name }}/">
</iframe>

<div id="iframe-overlay" class="iframe-overlay">
  <div id="iframe-loading" class="iframe-status">
    <div class="spinner-border text-secondary" role="status"></div>
    <p class="mt-3">Chargement...</p>
  </div>
  <div id="iframe-error" class="iframe-status" style="display:none;">
    <p class="fs-5">Le serveur ne répond pas.</p>
    <button id="iframe-reload" class="btn btn-primary mt-2">Recharger</button>
  </div>
</div>

<div id="side-panel" class="side-panel">
  <div class="side-menu" id="side-menu">
    <div class="side-menu-inner">
      <button id="stop-server" class="btn btn-sm btn-danger w-100">
        <i class="fa fa-power-off me-1"></i>Stop
      </button>
      <button id="home-btn" class="btn btn-sm btn-primary w-100">
        <i class="fa fa-home me-1"></i>Home
      </button>
    </div>
  </div>
  <button id="side-toggle" class="side-toggle" aria-expanded="false" title="Menu">
    <div class="toggle-logo-wrap">
      <img src="/services/tljh_plasma/service_static/images/logoPLASMA-v6-newHelice-simple.png" class="toggle-logo" alt="">
    </div>
    <i class="fa fa-chevron-left" id="toggle-icon"></i>
  </button>
</div>

{% else %}
<div class="container">
  <h1 class="visually-hidden">JupyterHub home page</h1>
  <div class="row">
    <div class="text-center">
      <a href="{{ base_url }}spawn"
         role="button"
         class="btn btn-lg btn-primary">
        Start My Server
      </a>
    </div>
  </div>
</div>
{% endif %}
{% endblock main %}

{% block script %}
{{ super() }}
{% if default_server.active %}
<script>
document.addEventListener("DOMContentLoaded", function() {
    const BASE_URL = "{{ base_url }}";
    const CURRENT_USER = "{{ user.name }}";
    const CSRF_TOKEN = window.jhdata && window.jhdata.xsrf_token;
    const LOAD_TIMEOUT_MS = 15000;

    const overlay    = document.getElementById("iframe-overlay");
    const loading    = document.getElementById("iframe-loading");
    const error      = document.getElementById("iframe-error");
    const iframe     = document.getElementById("user-app-frame");
    const panel      = document.getElementById("side-panel");
    const toggleIcon = document.getElementById("toggle-icon");

    // ---- loading overlay ----

    function startLoadTimer() {
        return setTimeout(function() {
            loading.style.display = "none";
            error.style.display = "block";
        }, LOAD_TIMEOUT_MS);
    }

    var loadTimer = startLoadTimer();

    // ---- hub links ----

    // The Hub serves "frame-ancestors 'none'", so none of its pages can be
    // displayed inside the iframe: those navigations must target the top window.
    // BASE_URL is already the Hub prefix ("/hub/"), as the API calls below show.

    function isHubUrl(url) {
        try {
            const u = new URL(url, window.location.href);
            return u.origin === window.location.origin
                && u.pathname.startsWith(BASE_URL);
        } catch(e) {
            return false;
        }
    }

    function openAtTop(url) {
        window.top.location.href = new URL(url, window.location.href).href;
    }

    // ---- server-proxy launcher links ----

    // Only the launcher entries of jupyter-server-proxy (RStudio...) are loaded
    // in the iframe. Any other window.open() keeps its native behaviour: an
    // export is a download and an RStudio preview is a popup, neither of them
    // must replace the application.
    const USER_URL = "{{ user.url }}";
    const launcherPaths = new Set();
    let launchersFetched = false;

    function trimSlashes(path) {
        return path.replace(/\/+$/, "");
    }

    // The user server only accepts a cookie authenticated fetch() with its
    // XSRF token, which is in a cookie scoped to USER_URL: read it from the
    // iframe document, as JupyterLab does.
    function fetchLaunchers(iframeDoc) {
        const xsrf = iframeDoc.cookie.match(/(?:^|;\s*)_xsrf=([^;]*)/);
        if (!xsrf) {
            return;
        }
        launchersFetched = true;
        fetch(USER_URL + "server-proxy/servers-info", {
            headers: {"X-XSRFToken": xsrf[1]},
            redirect: "error"
        }).then(function(response) {
            if (!response.ok) {
                throw new Error("servers-info: " + response.status);
            }
            return response.json();
        }).then(function(data) {
            data.server_processes.forEach(function(sp) {
                launcherPaths.add(trimSlashes(USER_URL + sp.launcher_entry.path_info));
            });
        }).catch(function(err) {
            launchersFetched = false;
            console.error(err);
        });
    }

    function launcherOf(path) {
        return Array.from(launcherPaths).find(function(launcher) {
            return path === launcher || path.startsWith(launcher + "/");
        });
    }

    function isLauncherUrl(url) {
        // An application already in the iframe opens its own windows (RStudio
        // opens "rstudio/?view=rmarkdown" for a knit preview): leave them be.
        if (launcherOf(trimSlashes(iframe.contentWindow.location.pathname))) {
            return false;
        }
        try {
            const u = new URL(url, window.location.href);
            return u.origin === window.location.origin
                && launcherPaths.has(trimSlashes(u.pathname));
        } catch(e) {
            return false;
        }
    }

    iframe.onload = function() {
        clearTimeout(loadTimer);
        overlay.style.display = "none";
        try {
            const iframeDoc = iframe.contentDocument || iframe.contentWindow.document;
            if (!launchersFetched) {
                fetchLaunchers(iframeDoc);
            }
            iframeDoc.querySelectorAll("a[target='_blank']").forEach(link => {
                if (isHubUrl(link.href)) {
                    link.setAttribute("target", "_top");
                } else {
                    link.removeAttribute("target");
                }
            });
            const nativeOpen = iframe.contentWindow.open;
            iframe.contentWindow.open = function(url) {
                // "Hub Control Panel" and "Restart Server" call window.open()
                if (url && isHubUrl(url)) {
                    openAtTop(url);
                    return null;
                }
                if (url && isLauncherUrl(url)) {
                    error.style.display = "none";
                    loading.style.display = "block";
                    overlay.style.display = "flex";
                    loadTimer = startLoadTimer();
                    iframe.src = url;
                    return null;
                }
                // "Open in New Browser Tab" calls window.open() with no
                // argument and then sets location.href on the window it gets
                // back, so it needs a real tab like the other calls.
                return nativeOpen.apply(iframe.contentWindow, arguments);
            };
            // Some File menu entries must not run the hub-extension command:
            // "Log Out" navigates the iframe itself instead of calling
            // window.open(), and "Hub Control Panel" is remapped to the same
            // action as the Stop button. Intercept them before Lumino acts.
            // Lumino tags menu and command palette items with data-command, but
            // a menu fires its item on mouseup while the palette uses click:
            // hook both, in the capture phase to run first.
            const HUB_COMMANDS = {
                "hub:logout": function() { openAtTop(BASE_URL + "logout"); },
                "hub:control-panel": stopServer
            };
            // A single click emits both events, so run the action once per
            // gesture: the mouseup consumes the click that follows it.
            let handledOnMouseUp = false;
            function interceptHubCommand(ev) {
                const item = ev.target.closest && ev.target.closest("[data-command]");
                const action = item && HUB_COMMANDS[item.dataset.command];
                if (!action) {
                    return;
                }
                ev.preventDefault();
                ev.stopPropagation();
                if (ev.type === "click" && handledOnMouseUp) {
                    handledOnMouseUp = false;
                    return;
                }
                handledOnMouseUp = ev.type === "mouseup";
                action();
            }
            iframeDoc.addEventListener("mousedown", function() {
                handledOnMouseUp = false;
            }, true);
            iframeDoc.addEventListener("mouseup", interceptHubCommand, true);
            iframeDoc.addEventListener("click", interceptHubCommand, true);
        } catch(e) {}
    };

    document.getElementById("iframe-reload").addEventListener("click", function() {
        error.style.display = "none";
        loading.style.display = "block";
        overlay.style.display = "flex";
        iframe.src = iframe.src;
        loadTimer = startLoadTimer();
    });

    // ---- side panel toggle ----

    function openPanel() {
        panel.classList.add("expanded");
        document.getElementById("side-toggle").setAttribute("aria-expanded", "true");
        toggleIcon.className = "fa fa-chevron-right";
    }

    function closePanel() {
        panel.classList.remove("expanded");
        document.getElementById("side-toggle").setAttribute("aria-expanded", "false");
        toggleIcon.className = "fa fa-chevron-left";
    }

    openPanel();
    setTimeout(closePanel, 2000);

    document.getElementById("side-toggle").addEventListener("click", function() {
        const expanded = panel.classList.toggle("expanded");
        this.setAttribute("aria-expanded", expanded);
        toggleIcon.className = expanded ? "fa fa-chevron-right" : "fa fa-chevron-left";
    });

    // ---- stop server ----

    function stopServer() {
        if (!confirm("Quitter l'environnement ?")) return;
        fetch(BASE_URL + "api/users/" + CURRENT_USER + "/server", {
            method: "DELETE",
            headers: {"X-XSRFToken": CSRF_TOKEN}
        }).then(function(response) {
            if (response.ok) {
                window.location.href = BASE_URL + "spawn";
            } else {
                response.text().then(function(text) {
                    console.error(text);
                    alert("Erreur lors de l'arrêt du serveur.");
                });
            }
        }).catch(function(err) {
            console.error(err);
            alert("Erreur lors de l'arrêt du serveur.");
        });
    }

    document.getElementById("stop-server").addEventListener("click", stopServer);

    // ---- home: reset iframe to JupyterLab home ----

    document.getElementById("home-btn").addEventListener("click", function() {
        overlay.style.display = "flex";
        loading.style.display = "block";
        error.style.display = "none";
        iframe.src = BASE_URL + "user/" + CURRENT_USER + "/";
        loadTimer = startLoadTimer();
        closePanel();
    });
});
</script>
{% endif %}
{% endblock script %}
